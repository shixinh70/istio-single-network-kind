apiVersion: v1
kind: Namespace
metadata:
  name: peer-test-client
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: peer-client
  namespace: peer-test-client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-conf
  namespace: peer-test-client
data:
  helper.conf: |
    agent_address = "/run/spire/sockets/socket"
    cert_dir = "/svids"
    daemon_mode = true
    svid_file_name = "tls.crt"
    svid_key_file_name = "tls.key"
    svid_bundle_file_name = "ca.crt"
    key_file_mode = 0444
---
apiVersion: v1
kind: Pod
metadata:
  name: peer-client
  namespace: peer-test-client
  labels:
    app: peer-client
spec:
  serviceAccountName: peer-client
  containers:
  - name: app
    image: curlimages/curl:8.16.0
    command: ["sleep", "infinity"]
    ports:
    - containerPort: 8443
    volumeMounts:
    - name: svids
      mountPath: /svids
  - name: spiffe-helper
    image: ghcr.io/spiffe/spiffe-helper:0.9.0
    args: ["-config", "/run/spiffe-helper/helper.conf"]
    volumeMounts:
    - name: spire-agent-socket
      mountPath: /run/spire/sockets
      readOnly: true
    - name: svids
      mountPath: /svids
    - name: helper-config
      mountPath: /run/spiffe-helper
  volumes:
  - name: spire-agent-socket
    hostPath:
      path: /run/spire-1315/sockets
      type: Directory
  - name: svids
    emptyDir: {}
  - name: helper-config
    configMap:
      name: spiffe-helper-conf
---
apiVersion: v1
kind: Service
metadata:
  name: peer-client
  namespace: peer-test-client
spec:
  type: NodePort
  selector:
    app: peer-client
  ports:
  - port: 8443
    targetPort: 8443
    nodePort: 30543
