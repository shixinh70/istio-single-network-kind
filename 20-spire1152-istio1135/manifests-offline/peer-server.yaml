apiVersion: v1
kind: Namespace
metadata:
  name: peer-test-client
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: peer-client
  namespace: peer-test-client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-conf
  namespace: peer-test-client
data:
  helper.conf: |
    agent_address = "/run/spire/sockets/socket"
    cert_dir = "/svids"
    daemon_mode = true
    svid_file_name = "tls.crt"
    svid_key_file_name = "tls.key"
    svid_bundle_file_name = "ca.crt"
    key_file_mode = 0444
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtls-server-script
  namespace: peer-test-client
data:
  run.sh: |
    #!/bin/sh
    set -e
    apk add --no-cache openssl >/dev/null
    until [ -f /svids/tls.crt ]; do sleep 1; done
    echo "starting mTLS server on :8443 (openssl s_server -www)"
    while true; do
      openssl s_server -quiet -accept 8443 -cert /svids/tls.crt -cert_chain /svids/tls.crt -key /svids/tls.key \
        -CAfile /svids/ca.crt -verify_return_error -Verify 1 -www || true
    done
---
apiVersion: v1
kind: Pod
metadata:
  name: peer-server
  namespace: peer-test-client
  labels:
    app: peer-server
spec:
  serviceAccountName: peer-client
  containers:
  - name: app
    image: <YOUR_REGISTRY>/alpine:3.20
    command: ["/bin/sh", "/script/run.sh"]
    volumeMounts:
    - name: svids
      mountPath: /svids
      readOnly: true
    - name: script
      mountPath: /script
  - name: spiffe-helper
    image: <YOUR_REGISTRY>/spiffe/spiffe-helper:0.9.0
    args: ["-config", "/run/spiffe-helper/helper.conf"]
    volumeMounts:
    - name: spire-agent-socket
      mountPath: /run/spire/sockets
      readOnly: true
    - name: svids
      mountPath: /svids
    - name: helper-config
      mountPath: /run/spiffe-helper
  volumes:
  - name: spire-agent-socket
    hostPath:
      path: /run/spire-1315/sockets
      type: Directory
  - name: svids
    emptyDir: {}
  - name: helper-config
    configMap:
      name: spiffe-helper-conf
  - name: script
    configMap:
      name: mtls-server-script
---
apiVersion: v1
kind: Service
metadata:
  name: peer-server
  namespace: peer-test-client
spec:
  type: NodePort
  selector:
    app: peer-server
  ports:
  - port: 8443
    targetPort: 8443
    nodePort: 30543
