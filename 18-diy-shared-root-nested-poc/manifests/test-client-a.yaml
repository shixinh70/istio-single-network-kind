apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-client
  namespace: spire-nested-a
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spiffe-helper-conf
  namespace: spire-nested-a
data:
  helper.conf: |
    agent_address = "/run/spire/sockets/socket"
    cert_dir = "/svids"
    daemon_mode = true
    svid_file_name = "tls.crt"
    svid_key_file_name = "tls.key"
    svid_bundle_file_name = "ca.crt"
---
apiVersion: v1
kind: Pod
metadata:
  name: test-client
  namespace: spire-nested-a
  labels:
    app: test-client
spec:
  serviceAccountName: test-client
  containers:
  - name: app
    image: curlimages/curl:8.16.0
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: svids
      mountPath: /svids
  - name: spiffe-helper
    image: ghcr.io/spiffe/spiffe-helper:0.9.0
    args: ["-config", "/run/spiffe-helper/helper.conf"]
    volumeMounts:
    - name: spire-agent-socket
      mountPath: /run/spire/sockets
      readOnly: true
    - name: svids
      mountPath: /svids
    - name: helper-config
      mountPath: /run/spiffe-helper
  volumes:
  - name: spire-agent-socket
    hostPath:
      path: /run/spire-nested-a/sockets
      type: Directory
  - name: svids
    emptyDir: {}
  - name: helper-config
    configMap:
      name: spiffe-helper-conf
