apiVersion: v1
kind: Namespace
metadata:
  name: isolated-workload-test
  labels:
    istio.io/rev: isolated
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isolated-server-134
  namespace: isolated-workload-test
spec:
  replicas: 1
  selector: {matchLabels: {app: isolated-server-134}}
  template:
    metadata: {labels: {app: isolated-server-134}}
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0.0
        args: ["-text=hello from isolated-server-134 (cross-cluster isolated mTLS)", "-listen=:8080"]
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: isolated-server-134
  namespace: isolated-workload-test
spec:
  selector: {app: isolated-server-134}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: isolated-server-134-nodeport
  namespace: isolated-workload-test
spec:
  type: NodePort
  selector: {app: isolated-server-134}
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30883
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: isolated-strict
  namespace: isolated-workload-test
spec:
  mtls:
    mode: STRICT
