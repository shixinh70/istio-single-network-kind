apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-a
  namespace: shared-ns
spec:
  replicas: 2
  selector:
    matchLabels: {app: shared-svc}
  template:
    metadata:
      labels: {app: shared-svc}
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0.0
        args: ["-text=hello from cluster1", "-listen=:8080"]
        ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: shared-svc
  namespace: shared-ns
spec:
  selector: {app: shared-svc}
  ports: [{port: 8080, targetPort: 8080}]
