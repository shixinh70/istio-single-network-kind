apiVersion: v1
kind: Namespace
metadata:
  name: spire-test-server
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-test-server
  namespace: spire-test-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-test-server
  namespace: spire-test-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spire-test-server
  template:
    metadata:
      labels:
        app: spire-test-server
        spiffe.io/spire-managed-identity: "true"
      annotations:
        inject.istio.io/templates: "sidecar,spire"
    spec:
      serviceAccountName: spire-test-server
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0.0
        args: ["-text=hello from spire-test-server (cluster1-134, trust domain cluster1-134-spire.local) via SPIRE-issued cert on Istio 1.29.6", "-listen=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: spire-test-server
  namespace: spire-test-server
spec:
  type: NodePort
  selector:
    app: spire-test-server
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30644
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: spire-test-server-strict
  namespace: spire-test-server
spec:
  selector:
    matchLabels:
      app: spire-test-server
  mtls:
    mode: STRICT
---
# 只允許 cluster1 的 spire-test-client SPIFFE ID（trust domain cluster1-spire.local）連進來
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: spire-test-server-allow-cluster1-only
  namespace: spire-test-server
spec:
  selector:
    matchLabels:
      app: spire-test-server
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster1-spire.local/cluster/cluster1/spire-test-client"
